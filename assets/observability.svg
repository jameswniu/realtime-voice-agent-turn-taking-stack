<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 668" width="1040" height="668" role="img" aria-label="Production observability: responsiveness, conversation, and model governance panels with the unattended watchdog process"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A98B4F"/><stop offset="0.28" stop-color="#E8D5A8"/><stop offset="0.5" stop-color="#C6A664"/><stop offset="0.72" stop-color="#F4E9CC"/><stop offset="1" stop-color="#9C7E45"/></linearGradient><linearGradient id="iv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF6EE"/><stop offset="1" stop-color="#F1E9DA"/></linearGradient></defs>
<rect width="1040" height="668" rx="9" fill="url(#iv)"/><rect width="1040" height="668" rx="9" fill="none" stroke="#6B5340"/><rect x="0" y="0" width="7" height="668" rx="3.5" fill="url(#gold)"/>
<text x="34" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16.1" letter-spacing="2" fill="#A98B4F" font-weight="700">FRONT OF HOUSE, MEASURED</text>
<text x="34" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" fill="#2B1B12" font-weight="700">Every production call feeds three panels</text>
<text x="1006" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#8A7666" text-anchor="end">39 calls / 3 days</text>

<!-- panel 1: responsiveness -->
<g>
<rect x="34" y="98" width="972" height="150" rx="8" fill="#FFFDF8" stroke="#D9C08A"/>
<text x="56" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="1.8" fill="#A83E32" font-weight="700">RESPONSIVENESS + RELIABILITY</text>
<text x="56" y="166" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Answer latency</text><text x="500" y="166" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">1.6s · p95 10.8s</text>
<text x="548" y="166" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Tool latency</text><text x="984" y="166" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">1.6s · p95 4.0s</text>
<text x="56" y="200" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Dead-air, 5s+ silent</text><text x="500" y="200" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">0.4 / call</text>
<text x="548" y="200" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Tool reliability</text><text x="984" y="200" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">1% fail of 81</text>
<text x="56" y="234" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Slowest tool, named</text><text x="500" y="234" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#A83E32" text-anchor="end" font-weight="700">check_notes 7%</text>
<text x="548" y="234" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Clean close</text><text x="984" y="234" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#7B8B4F" text-anchor="end" font-weight="700">100%</text>
</g>

<!-- panel 2: conversation -->
<g>
<rect x="34" y="262" width="972" height="150" rx="8" fill="#FFFDF8" stroke="#D9C08A"/>
<text x="56" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="1.8" fill="#A83E32" font-weight="700">CONVERSATION + USAGE</text>
<text x="56" y="330" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Friction, you correct her</text><text x="500" y="330" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#7B8B4F" text-anchor="end" font-weight="700">0%</text>
<text x="548" y="330" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Interruptions, talked over</text><text x="984" y="330" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">0.5 / call</text>
<text x="56" y="364" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Turns per call</text><text x="500" y="364" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">9.1</text>
<text x="548" y="364" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Call length, avg</text><text x="984" y="364" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">43s</text>
<text x="56" y="398" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Tool mix</text><text x="500" y="398" font-size="15.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">end_call 25 · joke 14 · notes 13</text>
<text x="548" y="398" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Volume</text><text x="984" y="398" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">39 calls / 3 days</text>
</g>

<!-- panel 3: governance -->
<g>
<rect x="34" y="426" width="972" height="150" rx="8" fill="#FFFDF8" stroke="#D9C08A"/>
<text x="56" y="458" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="1.8" fill="#A83E32" font-weight="700">MODEL GOVERNANCE</text>
<text x="56" y="494" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Backup brain order</text><text x="500" y="494" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#7B8B4F" text-anchor="end" font-weight="700">pinned, not vendor default</text>
<text x="548" y="494" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Backup actually fired</text><text x="984" y="494" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">11/64 convs · 17%</text>
<text x="56" y="528" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Rogue models billed</text><text x="500" y="528" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#7B8B4F" text-anchor="end" font-weight="700">none, allowlist checked</text>
<text x="548" y="528" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">LLM burn vs pinned</text><text x="984" y="528" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#A83E32" text-anchor="end" font-weight="700">1.82x flagged</text>
<text x="56" y="562" font-size="17.5" font-family="-apple-system,'Segoe UI',sans-serif" fill="#2B1B12">Credits</text><text x="500" y="562" font-size="16.5" font-family="ui-monospace,Menlo,monospace" fill="#6B5340" text-anchor="end" font-weight="700">burn + days left, daily</text>
</g>

<!-- watchdog band -->
<rect x="34" y="592" width="972" height="56" rx="8" fill="#2B1B12"/>
<text x="56" y="616" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="1.8" fill="#C6A664" font-weight="700">UNATTENDED PROCESS</text>
<text x="56" y="637" font-size="15" font-family="-apple-system,'Segoe UI',sans-serif" fill="#F1E9DA">bridge watchdog every 30m · metrics sweep every 6h · daily model watch: credit burn, allowlist, bye-without-hangup</text>
<text x="984" y="628" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8A7666" text-anchor="end">cron, not hope</text>
</svg>
