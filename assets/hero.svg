<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"
 aria-label="realtime-voice-agent-turn-taking-stack: a white-glove voice concierge on a real phone number">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6EE"/><stop offset="100%" stop-color="#F3ECDF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A98B4F"/><stop offset="28%" stop-color="#E8D5A8"/>
      <stop offset="50%" stop-color="#C6A664"/><stop offset="72%" stop-color="#F4E9CC"/>
      <stop offset="100%" stop-color="#9C7E45"/>
    </linearGradient>
    <linearGradient id="goldrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B5340" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6B5340" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#6B5340" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#ivory)"/>
  <rect x="14" y="14" width="1172" height="392" fill="none" stroke="#6B5340" stroke-width="1.4"/>
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#C9B69C" stroke-width="1"/>

  <!-- concierge bell, drawn -->
  <g transform="translate(600,74)">
    <circle cx="0" cy="-26" r="4.5" fill="url(#gold)"/>
    <rect x="-2" y="-24" width="4" height="7" fill="#B3945A"/>
    <path d="M -34 12 A 34 34 0 0 1 34 12 Z" fill="url(#gold)"/>
    <rect x="-44" y="14" width="88" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="-52" y="21" width="104" height="3" rx="1.5" fill="#A83E32" opacity=".85"/>
  </g>

  <text x="600" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" fill="#8A7666" letter-spacing="2">realtime-voice-agent-turn-taking-stack</text>

  <text x="600" y="186" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="44" font-weight="700" fill="#2B1B12" letter-spacing=".5">At your service, on the first ring.</text>

  <text x="600" y="222" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="19" fill="#5C4A3D">A voice concierge on a real phone number — and the white-glove inspection that keeps her flawless.</text>

  <rect x="240" y="252" width="720" height="1.4" fill="url(#goldrule)"/>

  <!-- service ledger -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="330" y="296" font-size="30" font-weight="700" fill="#2B1B12">61</text>
    <text x="330" y="322" font-size="14" fill="#8A7666" letter-spacing="1.4">CASES IN THE SUITE</text>
    <text x="510" y="296" font-size="30" font-weight="700" fill="#2B1B12">2</text>
    <text x="510" y="322" font-size="14" fill="#8A7666" letter-spacing="1.4">TRANSPORTS</text>
    <text x="690" y="296" font-size="30" font-weight="700" fill="#2B1B12">16</text>
    <text x="690" y="322" font-size="14" fill="#8A7666" letter-spacing="1.4">TOOLS ON CALL</text>
    <text x="870" y="296" font-size="30" font-weight="700" fill="#2B1B12">24/7</text>
    <text x="870" y="322" font-size="14" fill="#8A7666" letter-spacing="1.4">SHE PICKS UP</text>
  </g>

  <!-- service rail -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="240" y="348" width="118" height="30" rx="15" fill="none" stroke="#6B5340" stroke-opacity=".7"/>
    <text x="299" y="368" text-anchor="middle" fill="#5C4A3D">greet</text>
    <circle cx="372" cy="363" r="2" fill="#6B5340"/>
    <rect x="386" y="348" width="118" height="30" rx="15" fill="none" stroke="#6B5340" stroke-opacity=".7"/>
    <text x="445" y="368" text-anchor="middle" fill="#5C4A3D">hear</text>
    <circle cx="518" cy="363" r="2" fill="#6B5340"/>
    <rect x="532" y="348" width="118" height="30" rx="15" fill="none" stroke="#6B5340" stroke-opacity=".7"/>
    <text x="591" y="368" text-anchor="middle" fill="#5C4A3D">fetch</text>
    <circle cx="664" cy="363" r="2" fill="#6B5340"/>
    <rect x="678" y="348" width="118" height="30" rx="15" fill="none" stroke="#6B5340" stroke-opacity=".7"/>
    <text x="737" y="368" text-anchor="middle" fill="#5C4A3D">speak</text>
    <circle cx="810" cy="363" r="2" fill="#6B5340"/>
    <rect x="824" y="348" width="136" height="30" rx="15" fill="url(#gold)"/>
    <text x="892" y="368" text-anchor="middle" fill="#2B1B12" font-weight="700">inspected</text>
  </g>
</svg>
