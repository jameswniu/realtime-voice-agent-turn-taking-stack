<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1116" viewBox="0 0 1240 1116" role="img" aria-label="realtime-voice-agent-turn-taking-stack architecture: caller, ElevenLabs agent, tool server, evals"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#140806"/><stop offset="55%" stop-color="#241009"/><stop offset="100%" stop-color="#3B1710"/></linearGradient></defs><rect width="1240" height="1116" rx="14" fill="url(#bg)"/><rect width="1240" height="1116" rx="14" fill="none" stroke="#4A241C" stroke-width="1.5"/><circle cx="34" cy="34" r="7" fill="#B04437"/><circle cx="58" cy="34" r="7" fill="#D96A57" opacity=".55"/><circle cx="82" cy="34" r="7" fill="#E8A196" opacity=".35"/><text x="620" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#D9998B" text-anchor="middle">realtime-voice-agent-turn-taking-stack — the stack, end to end</text><rect x="28" y="58" width="1184" height="1" fill="#4A241C"/><text x="46" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" font-weight="700" fill="#D96A57" letter-spacing="1.5" xml:space="preserve">CALLER</text><text x="46" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  iPhone ── Twilio PSTN, 8 kHz ────────────┐      browser widget / WebSocket, 16 kHz ──┐</text><text x="46" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#9A6B5E" xml:space="preserve">  (the hard lane: telephony audio)         │      (what the harness drives)            │</text><text x="46" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">                                           ▼                                           ▼</text><text x="46" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" font-weight="700" fill="#D96A57" letter-spacing="1.5" xml:space="preserve">ELEVENLABS AGENTS PLATFORM</text><text x="46" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  ┌────────────────────────────────────────────────────────────────────────────────────┐</text><text x="46" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  │  ASR   scribe_realtime · control keywords (&quot;next&quot;, &quot;that&#x27;s all&quot;, &quot;bye&quot;...)         │</text><text x="46" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  │  TURN  turn_v3 · eager · 3.0s timeout · speculative                                │</text><text x="46" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  │  LLM   {{AGENT_LLM}} · temp 0 · backup cascade at 4.0s                             │</text><text x="46" y="458" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  │  TTS   eleven_flash_v2 · voice {{VOICE_ID}} · stability .50 · similarity .95       │</text><text x="46" y="492" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  │  SYS   end_call · voicemail_detection   (the hang-up doctrine lives in these)      │</text><text x="46" y="526" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  └──────────────────────────────────┬─────────────────────────────────────────────────┘</text><text x="46" y="560" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#9A6B5E" xml:space="preserve">                                     │  16 webhook tools, one server</text><text x="46" y="594" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">                                     ▼</text><text x="46" y="628" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" font-weight="700" fill="#D96A57" letter-spacing="1.5" xml:space="preserve">TOOL SERVER   {{TOOL_SERVER}} — an OpenClaw gateway + thin shims</text><text x="46" y="662" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  fast   calculate · get_location · get_calendar · get_distance · list_calls</text><text x="46" y="696" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">         schedule_call · cancel_call · set_volume · play_music · create_playlist</text><text x="46" y="730" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  slow   check_notes (the consult brain, 10–22s) · tell_joke · check_telegram</text><text x="46" y="764" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">         make_song · save_note</text><text x="46" y="798" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#9A6B5E" xml:space="preserve">  get_weather skips the server entirely: straight to open-meteo, no key needed</text><text x="46" y="832" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" font-weight="700" fill="#D96A57" letter-spacing="1.5" xml:space="preserve">EVALS — the part that keeps her honest</text><text x="46" y="866" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  harness/talk-to-her.js        text socket, skips audio; measures routing + latency</text><text x="46" y="900" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  harness/talk-to-her-voice.js  real TTS ▸ ASR ▸ VAD; catches mishears + turn-taking</text><text x="46" y="934" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  evals/cases.py    61 probes mined verbatim from live calls, READ/WRITE tagged</text><text x="46" y="968" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  evals/suite.py    runner: checkpointed, majority-across-repeats, 1x then escalate reds</text><text x="46" y="1002" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  evals/grade.py    tier 0/1, pure code — decides ~54 of 55 with no model at all</text><text x="46" y="1036" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  evals/judge.py    tier 2 — structural probe (the letter) + vibes probe (the ear)</text><text x="46" y="1070" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="400" fill="#F7E9E4" xml:space="preserve">  evals/metrics.py  production calls ONLY; harness traffic filtered out, exclusions published</text><text x="46" y="1098" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#B58275" opacity=".92">placeholders in {{double braces}} are yours to fill · interactive version: architecture.html</text></svg>
