<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1330" viewBox="0 0 980 1330" role="img" aria-label="aj-voice-agent architecture: caller, ElevenLabs agent, tool server, and the evals referee">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#FAF6EE"/><stop offset="1" stop-color="#F1E9DA"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8D5A8"/><stop offset="0.5" stop-color="#C6A664"/><stop offset="1" stop-color="#A98B4F"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A98B4F"/></marker></defs>
<rect x="1.5" y="1.5" width="977" height="1327" rx="18" fill="url(#bg)" stroke="#6B5340" stroke-width="1.6"/>
<rect x="9" y="9" width="962" height="1312" rx="13" fill="none" stroke="#D8C6AC" stroke-width="1"/>
<rect x="34" y="150" width="5" height="1030" rx="2.5" fill="url(#acc)"/>
<text x="62" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="3.4" fill="#A98B4F">SYSTEM MAP</text>
<text x="62" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#2B1B12" letter-spacing="0.3">Architecture</text>
<text x="62" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#9C8672">One call, top to bottom. The bright band is the referee.</text>
<rect x="682" y="46" width="236" height="58" rx="12" fill="#FFFDF8" stroke="#C6A664" stroke-width="1.4"/>
<text x="902" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#5C4A3D" text-anchor="end">2 transports / 16 tools</text>
<text x="902" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#5C4A3D" text-anchor="end">61 cases / 8 kHz floor</text>
<text x="62" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#A83E32">01</text>
<text x="96" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16.5" font-weight="700" letter-spacing="2.2" fill="#2B1B12">CALLER</text>
<text x="220" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9C8672">two transports, one agent; the difference is the testing story</text>
<line x1="62" y1="190" x2="918" y2="190" stroke="#D8C6AC" stroke-width="1"/>
<rect x="62" y="196" width="356" height="116" rx="14" fill="#FFFDF8" stroke="#6B5340" stroke-width="1.4"/>
<rect x="76" y="197.5" width="328" height="1" rx="0.5" fill="#E8D5A8" opacity="0.5"/>
<text x="82" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">Twilio PSTN, 8 kHz</text>
<text x="82" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">telephony audio, the hard lane</text>
<text x="82" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#8A7666">&#x27;next&#x27; and &#x27;thanks&#x27; collide here</text>
<rect x="500" y="196" width="356" height="116" rx="14" fill="#FFFDF8" stroke="#6B5340" stroke-width="1.4"/>
<rect x="514" y="197.5" width="328" height="1" rx="0.5" fill="#E8D5A8" opacity="0.5"/>
<text x="520" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">WebSocket, 16 kHz</text>
<text x="520" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">widget sessions and the probe harness</text>
<text x="520" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#8A7666">user_audio_chunk, pcm_16000</text>
<text x="62" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#A83E32">02</text>
<text x="96" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16.5" font-weight="700" letter-spacing="2.2" fill="#2B1B12">AGENT</text>
<text x="206" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9C8672">ElevenLabs Agents platform; the router, not the brain</text>
<line x1="62" y1="370" x2="918" y2="370" stroke="#D8C6AC" stroke-width="1"/>
<rect x="62" y="376" width="356" height="150" rx="14" fill="#FFFDF8" stroke="#6B5340" stroke-width="1.4"/>
<rect x="76" y="377.5" width="328" height="1" rx="0.5" fill="#E8D5A8" opacity="0.5"/>
<text x="82" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">conversation loop</text>
<text x="82" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">scribe_realtime ASR, keyword-biased</text>
<text x="82" y="467" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">turn_v3, eager, 3.0s, speculative</text>
<text x="82" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#8A7666">soft-timeout filler off, deliberately</text>
<rect x="500" y="376" width="356" height="150" rx="14" fill="#FFFDF8" stroke="#6B5340" stroke-width="1.4"/>
<rect x="514" y="377.5" width="328" height="1" rx="0.5" fill="#E8D5A8" opacity="0.5"/>
<text x="520" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">generation</text>
<text x="520" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">agent LLM at temperature 0</text>
<text x="520" y="467" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">TTS eleven_flash_v2, your voice id</text>
<text x="520" y="510" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#8A7666">stability .50, similarity .95</text>
<path d="M 422 451 L 496 451" stroke="#A98B4F" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
<text x="62" y="570" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#A83E32">03</text>
<text x="96" y="570" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16.5" font-weight="700" letter-spacing="2.2" fill="#2B1B12">TOOLS</text>
<text x="206" y="570" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9C8672">16 webhooks, one server; weather goes straight to open-meteo</text>
<line x1="62" y1="584" x2="918" y2="584" stroke="#D8C6AC" stroke-width="1"/>
<rect x="62" y="590" width="356" height="150" rx="14" fill="#FFFDF8" stroke="#6B5340" stroke-width="1.4"/>
<rect x="76" y="591.5" width="328" height="1" rx="0.5" fill="#E8D5A8" opacity="0.5"/>
<text x="82" y="624" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">fast lane, 10 tools</text>
<text x="82" y="654" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">calendar, location, distance, calculate</text>
<text x="82" y="681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">calls, volume, music, playlists</text>
<text x="82" y="724" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#8A7666">call, then report in ONE sentence</text>
<rect x="500" y="590" width="356" height="150" rx="14" fill="#FFFDF8" stroke="#6B5340" stroke-width="1.4"/>
<rect x="514" y="591.5" width="328" height="1" rx="0.5" fill="#E8D5A8" opacity="0.5"/>
<text x="520" y="624" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">slow lane</text>
<text x="520" y="654" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">check_notes, the consult brain</text>
<text x="520" y="681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">deferral grammar holds the turn open</text>
<text x="520" y="724" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#8A7666">measured 10-22s end to end</text>
<path d="M 422 665 L 496 665" stroke="#A98B4F" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
<text x="62" y="784" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#A83E32">04</text>
<text x="96" y="784" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16.5" font-weight="700" letter-spacing="2.2" fill="#2B1B12">THE REFEREE</text>
<text x="290" y="784" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9C8672">every claim names the layer it was proven on</text>
<line x1="62" y1="798" x2="918" y2="798" stroke="#D8C6AC" stroke-width="1"/>
<rect x="62" y="804" width="356" height="150" rx="14" fill="#FBF2E2" stroke="#C6A664" stroke-width="2"/>
<rect x="76" y="805.5" width="328" height="1" rx="0.5" fill="#E8D5A8" opacity="0.5"/>
<text x="82" y="838" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">harness</text>
<text x="82" y="868" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">talk-to-her.js, text, no audio</text>
<text x="82" y="895" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">talk-to-her-voice.js, real ASR + VAD</text>
<text x="82" y="938" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#8A7666">a turn ends when her ANSWER lands</text>
<rect x="500" y="804" width="356" height="150" rx="14" fill="#FBF2E2" stroke="#C6A664" stroke-width="2"/>
<rect x="514" y="805.5" width="328" height="1" rx="0.5" fill="#E8D5A8" opacity="0.5"/>
<text x="520" y="838" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">suite</text>
<text x="520" y="868" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">61 cases mined from live calls</text>
<text x="520" y="895" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">1x, reds escalate to 3x, majority</text>
<text x="520" y="938" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#8A7666">checkpointed after every test</text>
<path d="M 422 879 L 496 879" stroke="#A98B4F" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
<rect x="62" y="972" width="794" height="92" rx="14" fill="#FBF2E2" stroke="#C6A664" stroke-width="2"/>
<rect x="76" y="973.5" width="766" height="1" fill="#E8D5A8" opacity="0.5"/>
<text x="82" y="1006" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#2B1B12">grade + judge</text>
<text x="82" y="1038" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">pure code decides ~54 of 55; the rest get two probes, the letter and the ear,</text>
<text x="82" y="1060" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17.5" fill="#5C4A3D">and their disagreement flags the test.</text>
<text x="62" y="1108" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#A83E32">05</text>
<text x="96" y="1108" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16.5" font-weight="700" letter-spacing="2.2" fill="#2B1B12">PRODUCTION</text>
<text x="276" y="1108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9C8672">metrics that exclude the instrument</text>
<line x1="62" y1="1122" x2="918" y2="1122" stroke="#D8C6AC" stroke-width="1"/>
<rect x="62" y="1126" width="356" height="64" rx="12" fill="#FFFDF8" stroke="#6B5340" stroke-width="1.4"/>
<text x="80" y="1152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15.5" fill="#5C4A3D">metrics.py: Twilio + owner only</text>
<text x="80" y="1176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A7666">the harness never grades itself</text>
<rect x="500" y="1126" width="356" height="64" rx="12" fill="#FFFDF8" stroke="#6B5340" stroke-width="1.4"/>
<text x="518" y="1152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#5C4A3D">exclusions published beside the numbers</text>
<text x="518" y="1176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A7666">a caller hanging up is not a failure</text>
<text x="62" y="1306" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#9C8672">placeholders in {{double braces}} are yours to fill  ·  interactive version: architecture.html</text>
